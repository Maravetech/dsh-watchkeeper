name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please remove credentials, tokens and private session content before posting.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Install ...
        2. Open ...
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Plugin version, DSH version and Node version.
      placeholder: dsh-watchkeeper 0.2.0 / DSH 0.2.x / Node 22.5
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: Output of `GET /watchkeeper/health` or lines from `$WATCHKEEPER_HOME/probe.log`, with secrets removed.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I removed credentials, tokens and private content.
          required: true
        - label: I searched existing issues.
          required: true
